# Declarative Sentinel configuration for the clinic host.
#
# Applied idempotently at every boot: entities are matched by natural key, created when
# missing, updated when drifted — and NEVER deleted. Removing an entry from this file leaves
# it in the store (absence != deletion); a section's `prune` flag makes the report SAY what a
# prune would remove, and v1 refuses to auto-delete.
#
# Secrets never live in this file: `secretRef` names an ENVIRONMENT VARIABLE that holds the
# value at apply time.

version: 1

realms:
  - key: clinic
    displayName: Clinic
    isDefault: true

    # Realm-wide policy values (reqs §12.2). Every level below may only tighten these.
    policies:
      session.idle_minutes: 480

    organizations:
      - key: lakeside
        displayName: Lakeside Clinic
        levels: [Clinic, Department]        # what each depth is called, for this tenant
        policies:
          session.idle_minutes: 120         # tighter than the realm; departments may go lower
        apps:
          - key: clinic-spa                 # allowed clinic-wide (inherit is the default)…
        domains:
          - domain: lakeside.example
            kind: emailDomain
            verified: true
        # Divisions nest here (reqs §4.6). Other sections reference them by PATH KEY:
        # `lakeside/cardiology`, never by a flat key.
        organizations:
          - key: cardiology
            displayName: Cardiology
            teams:
              - key: cath-lab
                displayName: Cath lab
          - key: records
            displayName: Records office
            kind: Back office               # this node's own label, instead of "Department"
            apps:
              - key: clinic-spa
                effect: deny                # …except in Records. Deny wins over the inherited allow.

    roles:
      # Realm-level role: no `organization` key.
      - key: support
        displayName: Support engineer
        grants:
          - pattern: "sentinel:org:view"
      # Node-local role for the clinic declared above. Its grants cascade to the departments.
      - key: org-admin
        displayName: Organization administrator
        organization: lakeside
        grants:
          - pattern: "sentinel:org:manage"
          - pattern: "sentinel:org:impersonate"
      # Node-local role two levels down, referenced by path key.
      - key: department-lead
        displayName: Department lead
        organization: lakeside/cardiology
        grants:
          - pattern: "sentinel:org:view"

    oidcClients:
      # First-party SPA: public client, PKCE-only, no secret. Linked to the clinic-spa app,
      # so the `apps` assignments above decide where it may sign users in (reqs §4.9).
      - clientId: clinic-spa
        type: public
        firstParty: true
        appKey: clinic-spa
        redirectUris:
          - https://app.clinic.example/callback
        allowedScopes: [openid, profile, email]

      # Server-side partner app: confidential, secret resolved from the environment.
      - clientId: partner-portal
        type: confidential
        secretRef: CLINIC_SECRET_PARTNER_PORTAL   # env var NAME, not a value
        requireConsent: true
        redirectUris:
          - https://portal.partner.example/oidc/callback
        allowedScopes: [openid, profile]
        accessTokenLifetime: "00:05:00"
